name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm

      - name: Install (docs only)
        run: pnpm install --frozen-lockfile --ignore-scripts --prefer-offline

      - name: Build docs
        run: pnpm docs:build

      # update-store 由 Release 工作流维护；首次发布前不存在，缺失时跳过
      - name: Checkout update feeds
        uses: actions/checkout@v7
        with:
          ref: update-store
          path: update-store
        continue-on-error: true

      - name: Merge update feeds
        run: |
          mkdir -p docs/.vitepress/dist/update
          for channel in latest pre; do
            if [ -d "update-store/$channel" ]; then
              cp -r "update-store/$channel" "docs/.vitepress/dist/update/$channel"
            fi
          done

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

      - id: deployment
        uses: actions/deploy-pages@v5
