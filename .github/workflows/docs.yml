name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm

      - name: Install (docs only)
        run: pnpm install --frozen-lockfile --ignore-scripts --prefer-offline

      - name: Build docs
        run: pnpm docs:build

      # 从最近一次正式版/预发行版下载 latest*.yml，改写成绝对 Release 下载地址
      - name: Prepare update feeds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isPrerelease --jq '[.[] | select(.isPrerelease == false)][0].tagName // ""')
          pre=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isPrerelease --jq '[.[] | select(.isPrerelease == true)][0].tagName // ""')
          for pair in "latest:$latest" "pre:$pre"; do
            channel=${pair%%:*}
            tag=${pair#*:}
            if [ -z "$tag" ]; then
              echo "[update-feed] 跳过 $channel：没有对应 release"
              continue
            fi
            mkdir -p "update-src/$channel"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'latest*.yml' --pattern '*.blockmap' --dir "update-src/$channel" --clobber
            node scripts/prepare-update-feed.mjs --from "update-src/$channel" --out "docs/.vitepress/dist/update/$channel" --tag "$tag"
          done

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

      - id: deployment
        uses: actions/deploy-pages@v5
