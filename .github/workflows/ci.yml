name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile --prefer-offline

      # ffmpeg-static 不会自动下载，由 postinstall 从镜像拉取；缓存命中可省一次 80MB 下载
      - name: Cache ffmpeg
        uses: actions/cache@v4
        with:
          path: node_modules/ffmpeg-static/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-b6.1.1

      - name: Verify
        run: pnpm verify
