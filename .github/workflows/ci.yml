name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm

      # ffmpeg-static 不会自动下载，由 postinstall 从镜像拉取。
      # 必须在 pnpm install 之前恢复缓存：install 期间 postinstall 就会联网下载，
      # 缓存放在 install 之后等于每次仍会下载 80MB。
      - name: Cache ffmpeg
        uses: actions/cache@v6
        with:
          path: node_modules/ffmpeg-static/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-b6.1.1

      - name: Install
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Verify
        run: pnpm verify
