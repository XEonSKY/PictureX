name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: guard tag on main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag commit must be on main
        run: |
          git fetch origin main --depth=1
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "标签提交不在 main 上，拒绝发布。" >&2
            exit 1
          fi

  build:
    name: build ${{ matrix.platform }}-${{ matrix.arch }}
    needs: guard
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: win
            arch: x64
            dist: dist
          - runner: ubuntu-latest
            platform: linux
            arch: x64
            dist: dist:linux
          - runner: macos-latest
            platform: mac
            arch: arm64
            dist: dist:mac

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm

      - name: Sync version from tag
        shell: bash
        run: |
          node -e "
          const fs = require('fs');
          const version = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          for (const file of ['package.json', 'apps/web/package.json', 'apps/desktop/package.json', 'packages/cli/package.json']) {
            const json = JSON.parse(fs.readFileSync(file, 'utf8'));
            json.version = version;
            fs.writeFileSync(file, JSON.stringify(json, null, 4) + '\n');
          }
          "

      - name: Install
        run: pnpm install --frozen-lockfile --prefer-offline

      # ffmpeg-static 不会自动下载，缓存可省每个平台一次 80MB 拉取
      - uses: actions/cache@v4
        with:
          path: node_modules/ffmpeg-static/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-b6.1.1

      # NSIS / dmg 等打包工具链下载缓存
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron-builder
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron-builder/Cache
          key: electron-builder-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Build installer
        run: pnpm desktop:${{ matrix.dist }}

      - name: Pack npm tarball
        shell: bash
        run: |
          pnpm pack:npm
          node -e "
          const fs = require('fs');
          const path = require('path');
          const file = fs.readdirSync('dist').find(name => name.endsWith('.tgz'));
          if (!file) { throw new Error('npm tarball not found'); }
          const version = require('./package.json').version;
          fs.renameSync(path.join('dist', file), path.join('dist', 'xeonsky-picturex-npm-' + process.env.MATRIX_PLATFORM + '-' + process.env.MATRIX_ARCH + '-' + version + '.tgz'));
          "
        env:
          MATRIX_PLATFORM: ${{ matrix.platform }}
          MATRIX_ARCH: ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: picturex-${{ matrix.platform }}-${{ matrix.arch }}
          # 只上传安装包；dist/desktop 下还有含完整 runtime 的未打包目录
          path: |
            dist/desktop/*.exe
            dist/desktop/*.dmg
            dist/desktop/*.zip
            dist/desktop/*.AppImage
            dist/desktop/*.blockmap
            dist/desktop/latest*.yml
            dist/*.tgz
          if-no-files-found: error
          retention-days: 3

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
