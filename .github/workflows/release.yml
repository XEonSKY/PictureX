name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: guard tag on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag commit must be on main
        run: |
          git fetch origin main --depth=1
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "标签提交不在 main 上，拒绝发布。" >&2
            exit 1
          fi

  build:
    name: build ${{ matrix.platform }}-${{ matrix.arch }}
    needs: guard
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: win
            arch: x64
            dist: dist
          - runner: ubuntu-latest
            platform: linux
            arch: x64
            dist: dist:linux
          - runner: macos-14
            platform: mac
            arch: arm64
            dist: dist:mac
          - runner: macos-13
            platform: mac
            arch: x64
            dist: dist:mac

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: pnpm

      - name: Sync version from tag
        shell: bash
        run: |
          node -e "
          const fs = require('fs');
          const version = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          for (const file of ['package.json', 'apps/web/package.json', 'apps/desktop/package.json', 'packages/cli/package.json']) {
            const json = JSON.parse(fs.readFileSync(file, 'utf8'));
            json.version = version;
            fs.writeFileSync(file, JSON.stringify(json, null, 4) + '\n');
          }
          "

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build installer
        run: pnpm desktop:${{ matrix.dist }}

      - name: Pack npm tarball
        shell: bash
        run: |
          pnpm pack:npm
          node -e "
          const fs = require('fs');
          const path = require('path');
          const dir = 'dist';
          const file = fs.readdirSync(dir).find(name => name.endsWith('.tgz'));
          if (!file) { throw new Error('npm tarball not found'); }
          const version = require('./package.json').version;
          const target = path.join(dir, 'xeonsky-picturex-npm-' + process.env.MATRIX_PLATFORM + '-' + process.env.MATRIX_ARCH + '-' + version + '.tgz');
          fs.renameSync(path.join(dir, file), target);
          "
        env:
          MATRIX_PLATFORM: ${{ matrix.platform }}
          MATRIX_ARCH: ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: picturex-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/desktop/**
            dist/*.tgz
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
