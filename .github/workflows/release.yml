name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: guard tag on main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag commit must be on main
        run: |
          git fetch origin main --depth=1
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "标签提交不在 main 上，拒绝发布。" >&2
            exit 1
          fi

  build:
    name: build ${{ matrix.platform }}-${{ matrix.arch }}
    needs: guard
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: win
            arch: x64
            dist: dist
          - runner: ubuntu-latest
            platform: linux
            arch: x64
            dist: dist:linux
          - runner: macos-latest
            platform: mac
            arch: arm64
            dist: dist:mac

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.21.0

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm

      # 带 -rc/-beta/-alpha 的标签走预发行通道 pre，否则走 latest
      - name: Resolve update channel
        id: channel
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" =~ -(rc|beta|alpha) ]]; then
            echo "name=pre" >> "$GITHUB_OUTPUT"
          else
            echo "name=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync version from tag
        shell: bash
        run: |
          node -e "
          const fs = require('fs');
          const version = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          for (const file of ['package.json', 'apps/web/package.json', 'apps/desktop/package.json', 'packages/cli/package.json']) {
            const json = JSON.parse(fs.readFileSync(file, 'utf8'));
            json.version = version;
            fs.writeFileSync(file, JSON.stringify(json, null, 4) + '\n');
          }
          "

      # 必须在 pnpm install 之前恢复：postinstall 会联网下载 ffmpeg，放后面等于缓存无效
      - uses: actions/cache@v6
        with:
          path: node_modules/ffmpeg-static/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-b6.1.1

      - name: Install
        run: pnpm install --frozen-lockfile --prefer-offline

      # NSIS / dmg 等打包工具链下载缓存
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron-builder
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron-builder/Cache
          key: electron-builder-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Build installer
        run: pnpm desktop:${{ matrix.dist }}
        env:
          # 让 electron-builder 生成 latest*.yml 并把 feed 地址写进 app-update.yml
          PX_UPDATE_URL: https://picturex.xeonsky.com/update/${{ steps.channel.outputs.name }}/

      - uses: actions/upload-artifact@v4
        with:
          name: picturex-${{ matrix.platform }}-${{ matrix.arch }}
          # 只上传安装包与更新元数据；未打包目录含完整 runtime，体积巨大
          path: |
            dist/desktop/*.exe
            dist/desktop/*.dmg
            dist/desktop/*.AppImage
            dist/desktop/*.blockmap
            dist/desktop/latest*.yml
          if-no-files-found: error
          retention-days: 3

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}

  pages:
    name: deploy docs and updates
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # 与 docs.yml 共用 pages 组：避免两次部署同时写 GitHub Pages
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.21.0

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm

      - name: Install (docs only)
        run: pnpm install --frozen-lockfile --ignore-scripts --prefer-offline

      - name: Build docs
        run: pnpm docs:build

      - name: Resolve update channel
        id: channel
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" =~ -(rc|beta|alpha) ]]; then
            echo "name=pre" >> "$GITHUB_OUTPUT"
          else
            echo "name=latest" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v8
        with:
          path: incoming
          merge-multiple: true

      # 安装包超过 GitHub 100MB 单文件限制，Pages 只托管元数据，URL 指向 Release 资产
      - name: Prepare update feed
        run: |
          node scripts/prepare-update-feed.mjs \
            --from incoming \
            --out "docs/.vitepress/dist/update/${{ steps.channel.outputs.name }}" \
            --tag "$GITHUB_REF_NAME"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

      - id: deployment
        uses: actions/deploy-pages@v5
