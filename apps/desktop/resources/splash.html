<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PictureX</title>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            background: #0b0d12;
            display: grid;
            place-items: center;
            overflow: hidden;
            user-select: none;
        }

        .splash {
            display: grid;
            justify-items: center;
            gap: 24px;
        }

        .mark {
            width: 88px;
            height: 88px;
            filter: drop-shadow(0 12px 32px rgba(10, 89, 247, 0.35));
        }

        .spinner {
            width: 26px;
            height: 26px;
            border: 2px solid rgba(255, 255, 255, 0.14);
            border-top-color: #317af7;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (prefers-color-scheme: light) {
            html,
            body {
                background: #f7f8fa;
            }

            .spinner {
                border-color: rgba(0, 0, 0, 0.12);
                border-top-color: #0a59f7;
            }
        }
    </style>
</head>
<body>
    <div class="splash">
        <svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PictureX">
            <defs>
                <linearGradient id="px-brand" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
                    <stop offset="0" stop-color="#0A59F7"/>
                    <stop offset="1" stop-color="#317AF7"/>
                </linearGradient>
                <clipPath id="px-clip">
                    <rect width="64" height="64" rx="16"/>
                </clipPath>
            </defs>
            <g clip-path="url(#px-clip)">
                <rect width="64" height="64" fill="url(#px-brand)"/>
                <circle cx="32" cy="32" r="23" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5"/>
                <rect x="15.5" y="17.5" width="33" height="29" rx="7" fill="none" stroke="#FFFFFF" stroke-width="3.2"/>
                <circle cx="25.5" cy="27" r="3" fill="#FFFFFF"/>
                <path d="M19.6 41.2 27 32.4 31.6 37.6 36.9 30.8 44.4 41.2Z" fill="#FFFFFF"/>
            </g>
        </svg>
        <div class="spinner"></div>
    </div>
</body>
</html>
